# Local Postgres with pgvector.  Start: docker compose up -d   Stop: docker compose down
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: filinglens-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: filinglens
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d filinglens"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
